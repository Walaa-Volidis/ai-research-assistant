[project]
name = "ai-research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "langchain-google-genai>=4.3.1",
    "langchain-mcp-adapters>=0.3.0",
    "langchain[openai]>=1.3.14",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

# main.py also matches Vercel's entrypoint auto-detection but exposes no WSGI app,
# so name the real one explicitly rather than relying on detection order.
[tool.vercel]
entrypoint = "app:app"
